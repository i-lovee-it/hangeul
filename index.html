const KEY='hangul_playground_full_v1';let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}const data={stars:Number(saved.stars)||0,correct:Number(saved.correct)||0,attempts:Number(saved.attempts)||0,trace:Number(saved.trace)||0,days:saved.days||{},easy:saved.easy!==false,muted:!!saved.muted};let page='home',selC='ㄴ',selV='ㅏ',learnType='c',learnLetter='ㄱ',quiz=null,traceLetter='가',drawing=false,strokes=0,traceCtx=null,quizLocked=false;const $=s=>document.querySelector(s);const app=$('#app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const btn=(label,action,cls='btn')=>`<button class="${cls}" data-action="${action}">${label}</button>`;function persist(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}function stamp(){const d=new Date();const k=`${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;data.days[k]=(data.days[k]||0)+1}function earn(n=1){data.stars+=n;stamp();persist();updateTop()}function updateTop(){$('#topStars').textContent=`⭐ ${data.stars}개`};function speak(t){if(data.muted||!('speechSynthesis' in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';u.rate=.78;u.pitch=1.08;const ko=speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith('ko'));if(ko)u.voice=ko;speechSynthesis.speak(u)}catch(e){}}function pop(title,body,art='🎉'){ $('#modalTitle').textContent=title;$('#modalText').textContent=body;$('#modalArt').textContent=art;$('#modal').classList.remove('hide')}$('#modalClose').onclick=()=>$('#modal').classList.add('hide');function title(t,sub='',extra=''){return `<div class="section-head"><div><h2>${t}</h2><p class="hint">${sub}</p></div>${extra}</div>`}function setPage(p){page=p;quiz=null;render()}function renderNav(){$('#nav').innerHTML=TABS.map(([id,em,t])=>`<button class="nav ${page===id?'active':''}" data-tab="${id}"><span>${em}</span>${t}</button>`).join('')}function render(){render function syllable(c,v){const ci=HANGUL_INITIALS.indexOf(c),vi=HANGUL_MEDIALS.indexOf(v);return ci<0||vi<0?'':String.fromCharCode(0xac00+ci*588+vi*28)}
// Prevent a regression where ㄴ + ㅏ incorrectly produced 까.
[['ㄱ','ㅏ','가'],['ㄴ','ㅏ','나'],['ㄷ','ㅏ','다'],['ㄹ','ㅏ','라'],['ㅁ','ㅏ','마'],['ㅅ','ㅏ','사'],['ㅇ','ㅏ','아'],['ㅎ','ㅣ','히'],['ㄴ','ㅗ','노'],['ㄱ','ㅜ','구']].forEach(([c,v,expected])=>{if(syllable(c,v)!==expected)throw Error('한글 조합 검증 실패: '+c+' + '+v)});
function combine(){let cs=data.easy?EASY_C:CONS,vs=data.easy?EASY_V:VOW;if(!cs.includes(selC))selC=cs[0];if(!vs.includes(selV))selV=vs[0];let s=syllable(selC,selV);app.innerHTML=title('글자 만들기 🧩','자음 하나, 모음 하나를 눌러 새로운 글자를 만들어 봐!',`${btn('쉬운 단계','easy','chip '+(data.easy?'active':''))} ${btn('전체 단계','all','chip '+(!data.easy?'active':''))}`)+`<div class="stage" style="margin-bottom:18px"><div class="composer"><div><div class="tile">${selC}</div><div class="boxlabel">자음</div></div><div class="symbol">+</div><div><div class="tile">${selV}</div><div class="boxlabel">모음</div></div><div class="symbol">=</div><div><div class="tile result">${s}</div><div class="boxlabel">완성 글자</div></div></div>${btn('🔊 '+s+' 읽어줘!','speak-syllable','btn green')}</div><div class="two"><div><h3>① 자음 고르기</h3><div class="grid letters">${cs.map(c=>btn(c,'cons-'+c,'choice '+(selC===c?'selected':''))).join('')}</div></div><div><h3>② 모음 고르기</h3><div class="grid vowels">${vs.map(v=>btn(v,'vow-'+v,'choice '+(selV===v?'selected':''))).join('')}</div></div></div>`}
function shuffle(a){const out=[...a];for(let i=out.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[out[i],out[j]]=[out[j],out[i]]}return out}
const SOUND_POOL=CONS.flatMap(c=>VOW.map(v=>syllable(c,v)));
let quizDeck={picture:[],listen:[]};
function nextQuizQuestion(kind){let deck=quizDeck[kind];if(!deck.length){deck=shuffle(kind==='picture'?WORDS.map((_,i)=>i):SOUND_POOL.map((_,i)=>i));quizDeck[kind]=deck}const id=deck.pop();const q=kind==='picture'?WORDS[id]:{e:'🎧',w:SOUND_POOL[id],a:SOUND_POOL[id]};const candidates=kind==='picture'?[...new Set(WORDS.map(x=>x.a))]:SOUND_POOL.filter(x=>x!==q.a&&x[0]===q.a[0]);let others=shuffle(candidates.filter(x=>x!==q.a)).slice(0,2);if(others.length<2)others=shuffle(SOUND_POOL.filter(x=>x!==q.a&&!others.includes(x))).slice(0,2);return {...q,options:shuffle([q.a,...others]),kind}}
function beginQuiz(kind){quiz={kind,index:0,score:0,q:nextQuizQuestion(kind),finished:false};quizLocked=false}
function quizView(kind){if(!quiz||quiz.kind!==kind)beginQuiz(kind);if(quiz.finished){app.innerHTML=title('참 잘했어! 🏆','다섯 문제를 모두 풀었어!')+`<div class="stage"><div style="font-size:95px">🎉</div><h2>5문제 중 ${quiz.score}문제 정답!</h2><p>⭐ 정답 하나마다 별 1개를 모았어!</p><p class="hint">다음 세트에서는 새로운 문제가 나와요.</p>${btn('다음 5문제 도전!','quiz-restart','btn pink')}</div>`;return}const q=quiz.q;app.innerHTML=title(kind==='picture'?'그림 퀴즈 🦋':'소리 퀴즈 🔊',kind==='picture'?'그림 이름의 첫 글자를 골라봐!':'들리는 한 글자를 골라봐!')+`<div class="progress"><div style="width:${quiz.index*20}%"></div></div><div class="stage"><div class="smallcap">${quiz.index+1} / 5 문제</div><div class="quiz-art">${kind==='picture'?q.e:'🎧'}</div><div class="word" id="quizWord">${kind==='picture'?'첫 글자는 무엇일까?':'🔊 소리를 들어봐!'}</div>${btn('🔊 '+(kind==='picture'?'그림 이름 듣기':'한 글자 듣기'),'quiz-speak','btn')}<div class="answers">${q.options.map(o=>btn(o,'answer-'+o,'choice')).join('')}</div><div class="feedback" id="feedback" aria-live="polite"></div>${btn('다음 문제 →','quiz-next','btn primary hide')}</div>`}
function picture(){quizView('picture')}function listen(){quizView('listen')}function answer(a){if(quizLocked||!quiz||quiz.finished)return;quizLocked=true;data.attempts++;const correct=a===quiz.q.a;if(correct){data.correct++;quiz.score++;earn(1);speak('정답! 참 잘했어!')}else{speak('괜찮아. 다시 해보자')}persist();document.querySelectorAll('[data-action^="answer-"]').forEach(b=>{let v=b.dataset.action.slice(7);if(v===quiz.q.a)b.classList.add('correct');else if(v===a)b.classList.add('wrong');b.disabled=true});$('#quizWord').textContent=quiz.q.w;$('#feedback').textContent=correct?'🎉 정답! 별 하나 획득!':'💛 정답은 '+quiz.q.a+'야! 다음 문제도 해보자';$('[data-action="quiz-next"]').classList.remove('hide')}
const TRACE=['가','나','다','라','마','바','사','아','자','차','카','타','파','하','고','노','도','모','소','오','우','이'];function trace(){app.innerHTML=title('따라 쓰기 ✏️','연한 글자를 손가락이나 애플펜슬로 따라 써봐!')+`<div class="center"><div class="settings" style="justify-content:center;margin-bottom:15px">${TRACE.map(c=>btn(c,'trace-'+c,'chip '+(c===traceLetter?'active':''))).join('')}</div><div class="canvaswrap"><canvas id="writing" aria-label="글자 따라 쓰기 영역"></canvas></div><div class="trace-row">${btn('🧽 다시 쓰기','trace-clear','btn')}${btn('🔊 글자 듣기','trace-speak','btn')}${btn('⭐ 다 썼어요!','trace-done','btn green')}</div><p class="hint">※ 따라 쓴 모양은 자동 채점하지 않아요. 부모님이 함께 확인해 주세요.</p></div>`;setupCanvas()}
function setupCanvas(){const cv=$('#writing');if(!cv)return;const ratio=Math.min(window.devicePixelRatio||1,2),r=cv.getBoundingClientRect();cv.width=Math.round(r.width*ratio);cv.height=Math.round(310*ratio);const ctx=cv.getContext('2d');ctx.setTransform(ratio,0,0,ratio,0,0);traceCtx=ctx;const w=r.width,h=310;ctx.fillStyle='#fffdf7';ctx.fillRect(0,0,w,h);ctx.strokeStyle='#e7e2d7';ctx.setLineDash([8,8]);ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(w/2,0);ctx.lineTo(w/2,h);ctx.moveTo(0,h/2);ctx.lineTo(w,h/2);ctx.stroke();ctx.setLineDash([]);ctx.font=`900 ${Math.min(245,w*.65)}px 'Apple SD Gothic Neo','Malgun Gothic',sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#e3e6eb';ctx.fillText(traceLetter,w/2,h/2+12);strokes=0;function pt(e){const a=cv.getBoundingClientRect();return{x:(e.clientX-a.left)*w/a.width,y:(e.clientY-a.top)*h/a.height}}cv.onpointerdown=e=>{e.preventDefault();drawing=true;strokes++;cv.setPointerCapture(e.pointerId);const p=pt(e);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+.1,p.y+.1);ctx.strokeStyle='#607ce9';ctx.lineWidth=13;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke()};cv.onpointermove=e=>{if(!drawing)return;e.preventDefault();const p=pt(e);ctx.lineTo(p.x,p.y);ctx.stroke()};cv.onpointerup=cv.onpointercancel=()=>{drawing=false}}
function reward(){app.innerHTML=title('나의 스티커 도감 ⭐','별을 모으면 새로운 친구가 나타나!')+`<div class="stage" style="margin-bottom:20px"><div style="font-size:70px">🌟</div><h2>지금까지 별 ${data.stars}개!</h2><p class="hint">퀴즈 정답과 따라 쓰기 완료로 별을 모아봐!</p></div><div class="sticker-grid">${STICKERS.map(([e,n,need])=>`<div class="sticker ${data.stars>=need?'earned':''}"><div class="art">${e}</div><strong>${data.stars>=need?n:'🔒 잠김'}</strong><div class="hint">⭐ ${need}개</div></div>`).join('')}</div>`}
function parent(){const days=Object.keys(data.days).length,rate=data.attempts?Math.round(data.correct/data.attempts*100):0;app.innerHTML=title('부모님 메뉴 ⚙️','이 기기에 저장된 학습 기록과 설정을 확인해요.')+`<div class="stat-grid"><div class="stat"><b>${days}</b>학습한 날</div><div class="stat"><b>${data.correct}</b>맞힌 문제</div><div class="stat"><b>${rate}%</b>정답률</div></div><h3>학습 설정</h3><div class="settings">${btn('쉬운 단계','easy','chip '+(data.easy?'active':''))}${btn('전체 단계','all','chip '+(!data.easy?'active':''))}${btn(data.muted?'🔇 음성 켜기':'🔊 음성 끄기','toggle-sound','chip')}</div><h3>기록</h3><p>⭐ 모은 별: <b>${data.stars}개</b> · ✏️ 따라 쓰기 완료: <b>${data.trace}회</b> · 푼 문제: <b>${data.attempts}개</b></p><p class="hint">음성 재생은 아이패드의 한국어 음성 설정에 따라 달라질 수 있어요. 파일을 다른 기기나 브라우저로 옮기면 학습 기록이 자동으로 이동하지 않아요.</p><div class="settings">${btn('학습 기록 초기화','reset','btn')}</div>`}
function action(a){if(a==='type-c'||a==='type-v'){learnType=a==='type-c'?'c':'v';learnLetter=learnType==='c'?'ㄱ':'ㅏ';learn();return}if(a.startsWith('letter-')){learnLetter=a.slice(7);learn();speak(learnLetter);return}if(a==='speak-learn'){speak(learnLetter);return}if(a==='easy'||a==='all'){data.easy=a==='easy';persist();render();return}if(a.startsWith('cons-')){selC=a.slice(5);combine();speak(selC);return}if(a.startsWith('vow-')){selV=a.slice(4);combine();speak(selV);return}if(a==='speak-syllable'){speak(syllable(selC,selV));return}if(a==='quiz-speak'){speak(quiz.kind==='listen'?quiz.q.a:quiz.q.w);return}if(a.startsWith('answer-')){answer(a.slice(7));return}if(a==='quiz-next'){quiz.index++;if(quiz.index>=5){quiz.finished=true;pop('퀴즈 완료!',`5문제 중 ${quiz.score}문제를 맞혔어!`,'🏆')}else{quiz.q=nextQuizQuestion(quiz.kind)}quizLocked=false;render();return}if(a==='quiz-restart'){beginQuiz(page);render();return}if(a.startsWith('trace-')&&a!=='trace-clear'&&a!=='trace-done'&&a!=='trace-speak'){traceLetter=a.slice(6);trace();speak(traceLetter);return}if(a==='trace-clear'){setupCanvas();return}if(a==='trace-speak'){speak(traceLetter);return}if(a==='trace-done'){if(strokes<1){pop('먼저 써볼까?','연한 글자를 손가락으로 따라 써봐!','✏️');return}data.trace++;earn(1);pop('정말 멋지게 썼어!','별 하나를 선물할게! ⭐','🌟');trace();return}if(a==='toggle-sound'){data.muted=!data.muted;persist();parent();return}if(a==='reset'){if(confirm('별, 스티커, 학습 기록을 모두 지울까요?')){Object.assign(data,{stars:0,correct:0,attempts:0,trace:0,days:{}});persist();parent();updateTop()}return}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab){setPage(b.dataset.tab);return}if(b.dataset.action)action(b.dataset.action)});window.addEventListener('resize',()=>{if(page==='trace')setupCanvas()});try{render()}catch(e){document.getElementById('app').innerHTML='<div style="padding:24px"><h2>⚠️ 화면 생성 오류</h2><p>'+String(e.message).replace(/</g,'&lt;')+'</p></div>'}
</script></body></html>
